# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── DataSource ────────────────────────────────────────────────────────────────
# H2 in-memory database (great for local development and demos).
# Switch to MySQL/PostgreSQL by uncommenting the block below and commenting this one.
spring.datasource.url=jdbc:h2:mem:nlsqldb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console (handy for inspecting the in-memory DB while running)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Run schema + seed scripts on startup (src/main/resources/schema.sql, data.sql)
spring.sql.init.mode=always

# ── MySQL (uncomment to use a real database) ──────────────────────────────────
# spring.datasource.url=jdbc:mysql://localhost:3306/your_database?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=your_db_user
# spring.datasource.password=your_db_password
# spring.sql.init.mode=never

# ── Gemini API ────────────────────────────────────────────────────────────────
# Set your Gemini API key here, or override via env variable GEMINI_API_KEY:
#   export GEMINI_API_KEY=AIza...
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.6-flash

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.nlsql=DEBUG
logging.level.org.springframework.web=INFO
